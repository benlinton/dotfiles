---
- name: Workstation setup (macOS)
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_facts['env'].get('SUDO_USER') or ansible_facts['user_id'] }}"

    # Brew casks like Docker and Tailscale call sudo internally in subprocesses
    # that Ansible spawns without a TTY. Ansible's become pipes the password via
    # stdin per-invocation — it never populates the credential cache, so brew's
    # subprocess sudo calls fail. Grant NOPASSWD for the specific commands these
    # casks need, then clean up at the end of the playbook.
    - name: Allow passwordless sudo for brew cask operations
      ansible.builtin.copy:
        content: "{{ remote_regular_user }} ALL=(ALL) NOPASSWD:SETENV: ALL\n"
        dest: /etc/sudoers.d/99-ansible-provision
        mode: "0440"
        validate: visudo -cf %s
      become: true

    # ------------------------------------------------------------------------
    # Install packages
    # ------------------------------------------------------------------------

    - name: Install packages (macOS)
      community.general.homebrew:
        name:
          - ack
          - age  # for git encyption
          - chezmoi
          - fnm
          - git
          - git-filter-repo
          - gh
          - htop
          - sops  # for git encyption
          - step
          - tailscale
          - tmux
          - vim
          - zoxide
        state: present

    # ------------------------------------------------------------------------
    # Install fonts
    # ------------------------------------------------------------------------

    - name: Install JetBrains Mono Nerd Font (macOS)
      community.general.homebrew_cask:
        name: font-jetbrains-mono-nerd-font
        state: present

    # ------------------------------------------------------------------------
    # Install applications
    # ------------------------------------------------------------------------

    - name: Install Alfred (macOS)
      community.general.homebrew_cask:
        name: alfred
        state: present

    - name: Install ChatGPT (macOS)
      community.general.homebrew_cask:
        name: chatgpt
        state: present
    
    - name: Install Claude Code (macOS)
      community.general.homebrew_cask:
        name: claude-code
        state: present

    - name: Install Docker Desktop (macOS)
      community.general.homebrew_cask:
        name: docker-desktop
        state: present

    - name: Install Firefox (macOS)
      community.general.homebrew_cask:
        name: firefox
        state: present

    - name: Install Google Chrome (macOS)
      community.general.homebrew_cask:
        name: google-chrome
        state: present
    
    - name: Install KeepingYouAwake (macOS)
      community.general.homebrew_cask:
        name: keepingyouawake
        state: present

    - name: Install Kitty (macOS)
      community.general.homebrew_cask:
        name: kitty
        state: present

    - name: Install Obsidian (macOS)
      community.general.homebrew_cask:
        name: obsidian
        state: present

    - name: Install Slack (macOS)
      community.general.homebrew_cask:
        name: slack
        state: present

    - name: Install Superwhisper (macOS)
      community.general.homebrew_cask:
        name: superwhisper
        state: present

    - name: Install Tailscale (macOS)
      community.general.homebrew_cask:
        name: tailscale-app
        state: present
    
    - name: Install The Unarchiver (macOS)
      community.general.homebrew_cask:
        name: the-unarchiver
        state: present

    - name: Install Transmit (macOS)
      community.general.homebrew_cask:
        name: transmit
        state: present

    - name: Install Viscosity (macOS)
      community.general.homebrew_cask:
        name: viscosity
        state: present

    - name: Install VLC (macOS)
      community.general.homebrew_cask:
        name: vlc
        state: present

    - name: Install VSCode (macOS)
      community.general.homebrew_cask:
        name: visual-studio-code
        state: present

    # ------------------------------------------------------------------------
    # Customize applications
    # ------------------------------------------------------------------------

    - name: Install fileicon (macOS)
      community.general.homebrew:
        name: fileicon
        state: present

    - name: Set custom Kitty icon (macOS)
      ansible.builtin.command:
        cmd: fileicon set /Applications/kitty.app {{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi/assets/icons/applications/kitty-dark.png
      changed_when: false
      failed_when: false

    - name: Refresh Dock to apply icon changes (macOS)
      ansible.builtin.command:
        cmd: killall Dock
      changed_when: false

    - name: Remove temporary sudo credential caching configuration
      ansible.builtin.file:
        path: /etc/sudoers.d/99-ansible-provision
        state: absent
      become: true
